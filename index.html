<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>JinxO</title>
  <meta name="description" content="JinxO — a 3×3 word bingo board you fill, mark and score right in your browser.">
  <meta name="theme-color" content="#3D3229">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JinxO">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="JinxO">
  <meta property="og:description" content="A 3×3 word bingo board you fill, mark and score right in your browser.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D3229'/%3E%3Cg fill='%23CDC1B4'%3E%3Crect x='10' y='10' width='12' height='12' rx='3'/%3E%3Crect x='26' y='10' width='12' height='12' rx='3'/%3E%3Crect x='42' y='10' width='12' height='12' rx='3'/%3E%3Crect x='10' y='26' width='12' height='12' rx='3'/%3E%3Crect x='42' y='26' width='12' height='12' rx='3'/%3E%3Crect x='10' y='42' width='12' height='12' rx='3'/%3E%3Crect x='26' y='42' width='12' height='12' rx='3'/%3E%3Crect x='42' y='42' width='12' height='12' rx='3'/%3E%3C/g%3E%3Crect x='26' y='26' width='12' height='12' rx='3' fill='%23E8A838'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --header: #3D3229;
      --board: #BBADA0;
      --cell: #CDC1B4;
      --surface: #FFFFFF;
      --surface-2: #F5F0E8;
      --text: #2C2418;
      --text-2: #6B5E50;
      --text-3: #9B8E80;
      --border: #E5DED4;
      --circle: #5B9BD5;
      --circle-bg: #DAEAF7;
      --star: #E8A838;
      --star-bg: #FDF0DB;
      --x-c: #D05555;
      --x-bg: #F9DEDE;
      --accent: #E8A838;
      --accent-h: #D49530;
      --bingo: #5BA87C;
      --danger: #D05555;
      --shadow: 0 8px 32px rgba(44, 36, 24, .10);
      --r: 10px;
      --r-sm: 6px;
      --font-d: 'DM Serif Display', Georgia, serif;
      --font-b: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif;
      --board-gap: 8px;
      --board-pad: 8px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      min-height: 56px;
      height: calc(56px + env(safe-area-inset-top, 0));
      padding-top: env(safe-area-inset-top, 0);
      background: var(--header);
      flex-shrink: 0;
      z-index: 10
    }

    .menu-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .10);
      border: none;
      cursor: pointer;
      color: #fff;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      transition: background .15s
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, .18)
    }

    .menu-btn:active {
      background: rgba(255, 255, 255, .06)
    }

    .menu-btn svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .logo {
      font-family: var(--font-d);
      font-size: 22px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -.5px
    }

    .hdr-spacer {
      flex: 1
    }

    .score-pill {
      display: none;
      align-items: baseline;
      gap: 4px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, .12);
      border-radius: var(--r-sm)
    }

    .score-pill.vis {
      display: flex
    }

    .score-num {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .score-lbl {
      font-size: 9px;
      font-weight: 700;
      color: rgba(255, 255, 255, .5);
      text-transform: uppercase;
      letter-spacing: .8px
    }

    .btn-new {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      padding: 0 14px;
      height: 36px;
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap
    }

    .btn-new:hover {
      background: var(--accent-h)
    }

    .btn-new:active {
      transform: scale(.96)
    }

    /* ── Sidebar ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 24, .3);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--surface);
      z-index: 30;
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow)
    }

    .sidebar.open {
      transform: translateX(0)
    }

    .sb-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      padding-top: env(safe-area-inset-top, 0);
      min-height: calc(56px + env(safe-area-inset-top, 0));
      border-bottom: 1px solid var(--border)
    }

    .sb-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 1.5px
    }

    .sb-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      border-radius: var(--r-sm);
      font-size: 20px;
      transition: background .15s
    }

    .sb-close:hover {
      background: var(--surface-2)
    }

    .sb-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px
    }

    .sb-empty {
      padding: 40px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-3)
    }

    .bi {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background .15s
    }

    .bi:hover {
      background: var(--surface-2)
    }

    .bi.active {
      background: var(--surface-2);
      box-shadow: inset 3px 0 0 var(--accent)
    }

    .bi-info {
      flex: 1;
      min-width: 0
    }

    .bi-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bi-meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .bi-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .bi-dot.setup {
      background: var(--accent)
    }

    .bi-dot.play {
      background: var(--bingo)
    }

    .bi-del {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      border-radius: var(--r-sm);
      font-size: 16px;
      opacity: 0;
      transition: opacity .15s, background .15s, color .15s;
      flex-shrink: 0
    }

    .bi:hover .bi-del {
      opacity: 1
    }

    .bi-del:hover {
      background: var(--x-bg);
      color: var(--danger)
    }

    .sb-foot {
      padding: 12px 8px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
      border-top: 1px solid var(--border)
    }

    .sb-new {
      width: 100%;
      padding: 10px;
      background: var(--surface-2);
      border: 1.5px dashed var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s, border-color .15s
    }

    .sb-new:hover {
      background: var(--surface);
      border-color: var(--text-3)
    }

    @media(hover:none) {
      .bi-del {
        opacity: .5
      }
    }

    /* ── Main (2048-style centering) ── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left, 0));
      padding-right: max(16px, env(safe-area-inset-right, 0));
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain
    }

    /* auto margins center vertically but never push content above the scroll origin */
    .main>* {
      margin-top: auto;
      margin-bottom: auto
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      max-width: 300px
    }

    .empty h1 {
      font-family: var(--font-d);
      font-size: 42px;
      color: var(--header);
      margin-bottom: 8px
    }

    .empty p {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 28px
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-family: var(--font-b);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s
    }

    .btn-primary:hover {
      background: var(--accent-h)
    }

    .btn-primary:active {
      transform: scale(.97)
    }

    /* ── Board View ── */
    .bv {
      --fit: max(360px, calc(100vh - 200px));
      width: min(100%, var(--fit));
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    @supports (height: 100dvh) {
      .bv {
        --fit: max(360px, calc(100dvh - 200px))
      }
    }

    .bv-name {
      grid-column: 1;
      grid-row: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    @media(min-width: 500px) {
      .bv-name {
        font-size: 22px;
      }
    }

    /* ── Board Layout (grid with labels) ── */
    .board-section {
      display: grid;
      grid-template-columns: 1fr 24px;
      grid-template-rows: auto auto;
      width: 100%
    }

    .board-grid {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--board-gap);
      padding: var(--board-pad);
      background: var(--board);
      border-radius: var(--r);
      box-shadow: var(--shadow)
    }

    .row-labels {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      padding: var(--board-pad) 0;
      gap: var(--board-gap)
    }

    .row-labels span {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-3);
      user-select: none;
      transition: color .2s
    }

    .row-labels span.bingo {
      color: var(--bingo)
    }

    .col-labels {
      grid-column: 1;
      grid-row: 3;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0 var(--board-pad);
      gap: var(--board-gap);
      margin-top: 5px
    }

    .col-labels span {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-3);
      user-select: none;
      transition: color .2s
    }

    .col-labels span.bingo {
      color: var(--bingo)
    }

    /* ── Cell ── */
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: var(--r-sm);
      aspect-ratio: 1;
      min-width: 0;
      padding: 10px;
      transition: background-color .12s, transform .12s;
      user-select: none;
      overflow: hidden
    }

    /* ── Setup Cell ── */
    .cell.st {
      background: var(--surface);
      cursor: text
    }

    .cell.st:focus-within {
      box-shadow: 0 0 0 2px var(--accent);
      z-index: 1
    }

    .cell.st.err {
      box-shadow: 0 0 0 2px var(--danger)
    }

    .ci {
      width: 100%;
      max-height: 100%;
      border: none;
      outline: none;
      background: 0 0;
      text-align: center;
      font-family: var(--font-b);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      padding: 0;
      resize: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.25;
      field-sizing: content;
      margin: auto;
    }

    .ci::placeholder {
      color: var(--text-3);
      font-weight: 400;
    }

    /* ── Play Cell ── */
    .cell.pl {
      background: var(--cell);
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none
    }

    .cell.pl.pressed {
      transform: scale(.96)
    }

    .cw {
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
      line-height: 1.25;
      word-break: break-word;
      hyphens: auto;
      white-space: pre-wrap;
      transition: color .12s;
    }

    .cind {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700
    }

    .cell.c1 {
      background: var(--circle-bg)
    }

    .cell.c1 .cw {
      color: var(--text)
    }

    .cell.c1 .cind {
      color: var(--circle)
    }

    .cell.c2 {
      background: var(--star-bg)
    }

    .cell.c2 .cw {
      color: var(--text)
    }

    .cell.c2 .cind {
      color: var(--star)
    }

    .cell.c3 {
      background: var(--x-bg)
    }

    .cell.c3 .cw {
      color: var(--text-2);
      text-decoration: line-through;
      text-decoration-color: var(--x-c);
      text-decoration-thickness: 2px
    }

    .cell.c3 .cind {
      color: var(--x-c)
    }

    /* ── Actions ── */
    .board-footer {
      grid-column: 1;
      grid-row: 4;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 85px
    }

    .bv-acts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%
    }

    .btn-full {
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-family: var(--font-b);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s
    }

    .btn-full:hover {
      background: var(--accent-h)
    }

    .btn-full:active {
      transform: scale(.97)
    }

    .hint {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.4
    }

    /* ── Legend ── */
    .leg {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 11px;
      color: var(--text-3)
    }

    .leg-i {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .leg-s {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700
    }

    .leg-s.ls1 {
      background: var(--circle-bg);
      color: var(--circle)
    }

    .leg-s.ls2 {
      background: var(--star-bg);
      color: var(--star)
    }

    .leg-s.ls3 {
      background: var(--x-bg);
      color: var(--x-c)
    }

    /* ── Secondary Buttons ── */
    .sec-btns {
      margin-top: 14px;
      display: flex;
      gap: 8px
    }

    .btn-sec {
      padding: 8px 16px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-b);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s
    }

    .btn-sec:hover {
      background: var(--surface-2);
      border-color: var(--text-3)
    }

    .btn-sec:active {
      transform: scale(.97)
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translate(-50%, 16px);
      opacity: 0;
      visibility: hidden;
      background: var(--header);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 600;
      z-index: 60;
      transition: transform .25s cubic-bezier(.4, 0, .2, 1), opacity .2s ease, visibility 0s linear .25s;
      pointer-events: none;
      width: max-content;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: var(--shadow)
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
      transition: transform .25s cubic-bezier(.4, 0, .2, 1), opacity .2s ease, visibility 0s
    }

    /* ── Focus ── */
    .btn-new:focus-visible,
    .btn-primary:focus-visible,
    .btn-full:focus-visible,
    .btn-sec:focus-visible,
    .sb-close:focus-visible,
    .menu-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px
    }

    .cell.pl:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -1px
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    /* ── Responsive ── */
    @media(max-width:400px) {
      .cw {
        font-size: 13px
      }

      .ci {
        font-size: 13px
      }

      .row-labels span,
      .col-labels span {
        font-size: 12px
      }

      .bv-name {
        margin-bottom: 10px
      }
    }

    @media(max-width:340px) {
      .bv {
        max-width: 320px
      }

      .board-section {
        grid-template-columns: 1fr 20px
      }
    }

    @media(min-width:500px) {
      .cw {
        font-size: 16px
      }

      .ci {
        font-size: 16px
      }

      :root {
        --board-pad: 12px;
        --board-gap: 12px
      }

      .bv {
        max-width: 560px
      }

      .row-labels span,
      .col-labels span {
        font-size: 16px
      }

      .board-section {
        grid-template-columns: 1fr 28px;
        padding-left: 28px /* balances the row labels so the grid sits on the page's center line */
      }
    }

    @media(min-width:768px) {
      .cell {
        aspect-ratio: 9 / 8
      }

      .cw {
        font-size: 18px
      }

      :root {
        --board-pad: 14px;
        --board-gap: 14px
      }

      .bv {
        max-width: 660px
      }

      .board-section {
        grid-template-columns: 1fr 32px;
        padding-left: 32px
      }

      .row-labels span,
      .col-labels span {
        font-size: 18px
      }
    }

    .lang-switch {
      display: flex;
      gap: 6px;
      margin-top: 8px
    }

    .lang-switch button {
      flex: 1;
      padding: 7px 4px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-b);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer
    }

    .lang-switch button.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--text-3)
    }

    /* ── Confirm Modal ── */
    .confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 24, .4);
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease
    }

    .confirm-modal.open {
      opacity: 1;
      pointer-events: all
    }

    .cm-card {
      background: var(--surface);
      border-radius: var(--r);
      padding: 20px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      box-shadow: var(--shadow);
      transform: scale(.95);
      transition: transform .2s ease
    }

    .confirm-modal.open .cm-card {
      transform: scale(1)
    }

    .cm-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px
    }

    .cm-desc {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 20px
    }

    .cm-btns {
      display: flex;
      gap: 8px
    }

    .cm-btns button {
      flex: 1
    }

    .btn-danger {
      padding: 8px 16px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s
    }

    .btn-danger:hover {
      background: #b84343
    }

    .btn-danger:active {
      transform: scale(.97)
    }

    /* ── Polish ── */
    .score-pill {
      border: none;
      font-family: var(--font-b);
      cursor: pointer;
      transition: background .15s
    }

    .score-pill:hover {
      background: rgba(255, 255, 255, .2)
    }

    .score-pill.bump .score-num {
      animation: bump .35s cubic-bezier(.3, 1.6, .5, 1)
    }

    @keyframes bump {
      40% {
        transform: scale(1.3)
      }
    }

    /* long single words shrink instead of breaking mid-word */
    .cell .lw {
      font-size: .82em
    }

    .cell .lw2 {
      font-size: .68em
    }

    .cell.pop .cind {
      animation: pop .28s cubic-bezier(.3, 1.6, .5, 1)
    }

    @keyframes pop {
      from {
        transform: scale(0)
      }
    }

    /* ── Bingo celebration ──
       Cells of a new line animate in a sweep outward from the tapped cell (--d = delay).
       Each bingo picks one flavor class on the grid, never the same twice in a row. */
    .board-grid .cell.cb {
      z-index: 1;
      animation: .6s cubic-bezier(.3, .7, .4, 1) var(--d, 0ms) both
    }

    .fx-wave .cell.cb {
      animation-name: fxWave
    }

    .fx-ripple .cell.cb {
      animation-name: fxRipple
    }

    .fx-sheen .cell.cb {
      animation-name: fxGlow
    }

    .fx-tilt .cell.cb {
      animation-name: fxTilt
    }

    .fx-sheen .cell.cb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .7) 50%, transparent 65%);
      transform: translateX(-110%);
      animation: fxSheen .7s ease-in-out var(--d, 0ms) both;
      pointer-events: none
    }

    @keyframes fxWave {
      0%,
      100% {
        transform: none;
        box-shadow: none
      }

      35% {
        transform: translateY(-6px) scale(1.035);
        box-shadow: 0 0 0 3px rgba(91, 168, 124, .55), 0 8px 14px -6px rgba(44, 36, 24, .35)
      }
    }

    @keyframes fxRipple {
      0% {
        box-shadow: 0 0 0 0 rgba(91, 168, 124, .7)
      }

      30% {
        transform: scale(1.03)
      }

      100% {
        transform: none;
        box-shadow: 0 0 0 10px rgba(91, 168, 124, 0)
      }
    }

    @keyframes fxGlow {
      0%,
      100% {
        box-shadow: none
      }

      45% {
        box-shadow: 0 0 0 3px rgba(91, 168, 124, .5)
      }
    }

    @keyframes fxSheen {
      to {
        transform: translateX(110%)
      }
    }

    /* --s alternates ±1 so neighbouring cells tilt opposite ways */
    @keyframes fxTilt {
      0%,
      100% {
        transform: none;
        box-shadow: none
      }

      25% {
        transform: rotate(calc(-2.5deg * var(--s, 1))) scale(1.04);
        box-shadow: 0 0 0 3px rgba(91, 168, 124, .5)
      }

      55% {
        transform: rotate(calc(1.5deg * var(--s, 1))) scale(1.02)
      }

      80% {
        transform: rotate(calc(-.5deg * var(--s, 1)))
      }
    }

    .row-labels span,
    .col-labels span {
      position: relative
    }

    .row-labels span.nb,
    .col-labels span.nb {
      animation: lblPop .45s cubic-bezier(.3, 1.6, .5, 1) var(--d, 0ms) both
    }

    @keyframes lblPop {
      40% {
        transform: scale(1.35)
      }
    }

    /* "+n" that drifts off the line's number */
    .lbl-pts {
      position: absolute;
      top: 50%;
      font-size: 12px;
      font-style: normal;
      font-weight: 800;
      color: var(--bingo);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0
    }

    .row-labels .lbl-pts {
      left: 50%;
      animation: ptsRow 1.2s ease-out var(--d, 0ms) both
    }

    .col-labels .lbl-pts {
      left: calc(50% + .8em);
      animation: ptsCol 1.2s ease-out var(--d, 0ms) both
    }

    @keyframes ptsRow {
      0% {
        opacity: 0;
        transform: translate(-50%, -120%)
      }

      20%,
      70% {
        opacity: 1
      }

      20% {
        transform: translate(-50%, -175%)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -250%)
      }
    }

    @keyframes ptsCol {
      0% {
        opacity: 0;
        transform: translate(0, -50%)
      }

      20%,
      70% {
        opacity: 1
      }

      20% {
        transform: translate(0, -90%)
      }

      100% {
        opacity: 0;
        transform: translate(0, -150%)
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    .bv-name {
      display: block;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding: 2px 10px;
      background: none;
      border: none;
      border-radius: var(--r-sm);
      font-family: var(--font-b);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: text;
      transition: background .15s
    }

    .bv-name:hover {
      background: var(--surface-2)
    }

    input.bv-name {
      width: 100%;
      text-align: center;
      outline: none;
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--accent)
    }

    .bi:focus-visible,
    .bi-del:focus-visible,
    .lang-switch button:focus-visible,
    .sb-new:focus-visible,
    .bv-name:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .score-pill:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px
    }

    .bi-del:focus-visible {
      opacity: 1
    }

    .lang-switch button {
      transition: background .15s, border-color .15s
    }

    .lang-switch button:hover {
      background: var(--surface-2)
    }

    .cm-desc {
      white-space: pre-line;
      line-height: 1.5
    }

    .cm-card.info .cm-desc {
      text-align: left
    }

    .cm-card.info #cmCancel {
      display: none
    }

    .cm-card.info #cmConfirm {
      background: var(--accent)
    }

    .cm-card.info #cmConfirm:hover {
      background: var(--accent-h)
    }

    /* Cell text tracks the board's actual size, not just the viewport breakpoint */
    @supports (container-type: inline-size) {
      .board-grid {
        container-type: inline-size
      }

      .cw,
      .ci {
        font-size: clamp(12px, 2.4cqi + 6px, 18px)
      }
    }

    .leg-arrow {
      color: var(--text-3);
      font-size: 10px;
      margin: 0 -2px
    }
  </style>
</head>

<body>

  <header class="header">
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 20 20">
        <line x1="3" y1="5" x2="17" y2="5" />
        <line x1="3" y1="10" x2="17" y2="10" />
        <line x1="3" y1="15" x2="17" y2="15" />
      </svg>
    </button>
    <div class="logo">JinxO</div>
    <div class="hdr-spacer"></div>

      <span class="score-num" id="scoreNum">0</span>
      <span class="score-lbl" data-i18n="pts">pts</span>

    <button class="btn-new" id="newBtn" data-i18n="new">+ New</button>
  </header>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" inert>

        id="closeBtn" aria-label="Close">&times;</button></div>
    <div class="sb-body" id="boardList"></div>
    <div class="sb-foot"><button class="sb-new" id="sbNewBtn" data-i18n="newBoard">+ New Board</button>
      <div class="lang-switch"><button type="button" id="langEn">English</button><button type="button"
          id="langKo">한국어</button></div>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="srLive" aria-live="polite"></div>

  <div class="confirm-modal" id="confirmModal">
    <div class="cm-card" role="dialog" aria-modal="true" aria-labelledby="cmTitle" aria-describedby="cmDesc">
      <div class="cm-title" id="cmTitle" data-i18n="confirmAction">Confirm Action</div>
      <div class="cm-desc" id="cmDesc" data-i18n="areYouSure">Are you sure?</div>
      <div class="cm-btns">
        <button class="btn-sec" id="cmCancel" data-i18n="cancel">Cancel</button>
        <button class="btn-danger" id="cmConfirm" data-i18n="confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    (function () {

      var KEY = 'jinxo_nks', LP = 450, state = load(),
        lpTmr = null, lpFired = false, celebrate = null, lastFx = -1,
        FX = ['wave', 'ripple', 'sheen', 'tilt'],
        popKey = null, lastPointer = 'mouse', focusSetup = false, lastScore = null,

      function load() {

        try {var d2 = JSON.parse(lsGet('jinxo_v2')); if (d2 && d2.boards) {lsSet(KEY, JSON.stringify(d2)); return d2} } catch (e) { }
        return {boards: [], activeId: null}
      }
      function save() {lsSet(KEY, JSON.stringify(state))}
      function uid() {return Date.now().toString(36) + Math.random().toString(36).slice(2, 7)}
      function esc(s) {var d = document.createElement('div'); d.textContent = s; return d.innerHTML}
      function aesc(s) {return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}

      /* ── Board Helpers ── */
      function getBoard(id) {return state.boards.find(function (b) {return b.id === id})}
      function activeBoard() {return getBoard(state.activeId)}
      function nextNum() {var s = {}; state.boards.forEach(function (b) {var m = b.name.match(/\d+/); if (m) s[+m[0]] = 1}); var n = 1; while (s[n]) n++; return n}
      function createBoard() {
        var b = {id: uid(), name: t('boardDefault', {n: nextNum()}), phase: 'setup', words: {}, marks: {}};
        for (var r = 1; r <= 3; r++)for (var c = 1; c <= 3; c++)b.words[r + '-' + c] = '';
        state.boards.push(b); state.activeId = b.id; save(); closeSb(); focusSetup = true; render();
      }

      function sm(b, r, c, v) {if (v === 0) delete b.marks[r + '-' + c]; else b.marks[r + '-' + c] = v; save()}
      function gw(b, r, c) {return b.words[r + '-' + c] || ''}

      function getBoardName(b) {
        var match = b.name.match(/^(?:Board|보드)\s+(\d+)$/i);
        if (match) {
          return t('boardDefault', { n: match[1] });

      }

      /* ── Dynamic Confirmation Modal ── */

        (options.info ? cmConfirm : cmCancel).focus();

      function openDeleteModal(id) {

      function calcScore(b) {
        var pts = 0, details = [], sc = 0, st = 0;

        for (i = 1; i <= 3; i++) {var ok2 = true; for (j = 1; j <= 3; j++)if (!eligible(gm(b, j, i))) {ok2 = false; break} if (ok2) {cols.push(i); for (j = 1; j <= 3; j++)cells[j + '-' + i] = 1} }
        return {rows: rows, cols: cols, cells: cells}
      }

      /* ── Sidebar ── */
      var sidebar = document.getElementById('sidebar'), overlayEl = document.getElementById('overlay');
      var menuBtn = document.getElementById('menuBtn');
      function openSb() {
        sidebar.inert = false; sidebar.classList.add('open'); overlayEl.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
        (sidebar.querySelector('.bi.active') || document.getElementById('closeBtn')).focus();
      }
      function closeSb() {
        var had = sidebar.contains(document.activeElement);
        sidebar.classList.remove('open'); overlayEl.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); sidebar.inert = true;
        if (had) menuBtn.focus();
      }
      menuBtn.onclick = openSb;
      document.getElementById('closeBtn').onclick = closeSb;
      overlayEl.onclick = closeSb;
      document.getElementById('newBtn').onclick = createBoard;
      document.getElementById('sbNewBtn').onclick = createBoard;
      document.getElementById('langEn').onclick = function () {setLanguage('en')};
      document.getElementById('langKo').onclick = function () {setLanguage('ko')};

      /* ── Toast ── */
      var toastEl = document.getElementById('toast'), toastTmr = null;
      function toast(msg) {clearTimeout(toastTmr); toastEl.textContent = msg; toastEl.classList.add('show'); toastTmr = setTimeout(function () {toastEl.classList.remove('show')}, 2400)}

      var srLive = document.getElementById('srLive');
      function announce(msg) {srLive.textContent = ''; setTimeout(function () {srLive.textContent = msg}, 50)}

      /* ── Render ── */
      var main = document.getElementById('main'), scorePill = document.getElementById('scorePill'), scoreNum = document.getElementById('scoreNum');

      function render() {renderSb(); renderMain(); updateHdr()}

      function updateHdr() {
        var b = activeBoard();
        document.title = b ? getBoardName(b) + ' \u00B7 JinxO' : 'JinxO';
        if (b && b.phase === 'play') {
          var total = calcScore(b).total, key = b.id + ':' + total;
          scorePill.classList.add('vis'); scoreNum.textContent = total;
          scorePill.setAttribute('aria-label', t('scoreTitle', {n: total}));
          if (lastScore && lastScore !== key && lastScore.split(':')[0] === b.id) {
            scorePill.classList.remove('bump'); void scorePill.offsetWidth; scorePill.classList.add('bump');
          }
          lastScore = key;
        }
        else {scorePill.classList.remove('vis'); lastScore = null}
      }

      /* Score breakdown — calcScore already itemizes, this just surfaces it */
      scorePill.onclick = function () {
        var b = activeBoard(); if (!b) return;
        var sc = calcScore(b), lines = sc.details.map(function (d) {return d.l + '  +' + d.v});
        openModal({
          info: true,
          title: t('scoreTitle', {n: sc.total}),
          desc: (lines.length ? lines.join('\n') : t('noPoints')) + '\n\n' + t('scoreRules'),
          buttonText: t('ok')
        });
      };

      function renderSb() {
        var list = document.getElementById('boardList');
        if (!state.boards.length) {list.innerHTML = '<div class="sb-empty">' + t('noBoards') + '</div>'; return }
        var h = '';
        state.boards.forEach(function (b) {
          var act = b.id === state.activeId, sc = b.phase === 'play' ? calcScore(b).total : 0;
          var dotCls = b.phase === 'setup' ? 'setup' : 'play', dotLabel = b.phase === 'setup' ? t('setup') : t('playing');
          var meta = dotLabel; if (b.phase === 'play' && sc > 0) meta += ' \u00B7 ' + sc + ' ' + t('pts');
          h += '<div class="bi' + (act ? ' active' : '') + '" data-id="' + b.id + '" role="button" tabindex="0"' + (act ? ' aria-current="true"' : '') + '><div class="bi-info"><div class="bi-name">' + esc(getBoardName(b)) + '</div><div class="bi-meta"><span class="bi-dot ' + dotCls + '"></span>' + meta + '</div></div><button class="bi-del" data-id="' + b.id + '" aria-label="' + aesc(t('delete')) + '">&times;</button></div>';
        });
        list.innerHTML = h;
        list.querySelectorAll('.bi').forEach(function (el) {
          el.addEventListener('click', function (e) {if (e.target.closest('.bi-del')) return; state.activeId = el.dataset.id; save(); closeSb(); render()});
          el.addEventListener('keydown', function (e) {if (e.target === el && (e.key === 'Enter' || e.key === ' ')) {e.preventDefault(); el.click()} });
        });
        list.querySelectorAll('.bi-del').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            openDeleteModal(btn.dataset.id); /* Triggers modal popup */
          });
        });
      }

      function renderMain() {
        var b = activeBoard();
        if (!b) {
          main.innerHTML = '<div class="empty"><h1>JinxO</h1><p>' + t('emptyDesc') + '</p><button class="btn-primary" id="empBtn">' + t('createBoard') + '</button></div>'; 
          document.getElementById('empBtn').onclick = createBoard; 
          return;
        }
        if (b.phase === 'setup') renderSetup(b); else renderPlay(b);
      }

      /* ── Grid: rows 3→1 top→bottom, cols 1→3 left→right ── */
      function gridCells(b, mode) {
        var h = '';
        for (var row = 3; row >= 1; row--) {
          for (var col = 1; col <= 3; col++) {
            var key = row + '-' + col, cls = 'cell ' + (mode === 'setup' ? 'st' : 'pl'), w, wv, ind = '';
            if (mode === 'setup') {
              wv = esc(gw(b, row, col));
              h += '<div class="' + cls + '" data-k="' + key + '"><textarea class="ci" placeholder="' + t('wordPlaceholder') + '" data-r="' + row + '" data-c="' + col + '">' + wv + '</textarea></div>';
            } else {
              var m = gm(b, row, col);
              if (m === 1) cls += ' c1'; else if (m === 2) cls += ' c2'; else if (m === 3) cls += ' c3';
              var fx = celebrateStyle(row, col), style = '';
              if (fx) {cls += ' cb'; style = ' style="' + fx + '"'}
              if (key === popKey) cls += ' pop';
              w = esc(gw(b, row, col));
              if (m === 1) ind = '<span class="cind">\u25CF</span>';
              if (m === 2) ind = '<span class="cind">\u2605</span>';
              if (m === 3) ind = '<span class="cind">\u2715</span>';
              h += '<div class="' + cls + '" data-r="' + row + '" data-c="' + col + '" tabindex="0"' + style + '>' + ind + '<span class="cw' + fitCls(gw(b, row, col)) + '">' + w + '</span></div>';
            }
          }
        }
        return h;
      }

      /* Longest unbroken run, Hangul/CJK weighted ~2x latin */
      function fitCls(w) {
        var n = 0;
        w.split(/\s+/).forEach(function (s) {var l = 0; for (var i = 0; i < s.length; i++) l += s.charCodeAt(i) > 0x2E7F ? 1.8 : 1; if (l > n) n = l});
        return n > 16 ? ' lw2' : n > 11 ? ' lw' : '';
      }

      function nameHtml(b) {
        return '<button type="button" class="bv-name" id="bvName" title="' + aesc(t('renameBoard')) + '">' + esc(getBoardName(b)) + '</button>';
      }

      function bindRename(b) {
        var btn = document.getElementById('bvName');
        btn.onclick = function () {
          var inp = document.createElement('input'), done = false;
          inp.className = 'bv-name'; inp.maxLength = 40; inp.value = getBoardName(b);
          inp.setAttribute('aria-label', t('renameBoard'));
          btn.replaceWith(inp); inp.focus(); inp.select();
          function finish(keep) {
            if (done) return; done = true;
            var v = inp.value.trim();
            if (keep && v && v !== getBoardName(b)) {b.name = v; save()}
            render();
            var nb = document.getElementById('bvName'); if (nb) nb.focus();
          }
          inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.isComposing) {e.preventDefault(); finish(true)}
            else if (e.key === 'Escape') {e.preventDefault(); e.stopPropagation(); finish(false)}
          });
          inp.addEventListener('blur', function () {finish(true)});
        };
      }

      /* Sweep delay for a cell on a just-completed line: distance from the tapped cell */
      function celebrateStyle(row, col) {
        var cb = celebrate;
        if (!cb || (cb.rows.indexOf(row) === -1 && cb.cols.indexOf(col) === -1)) return '';
        var dist = Math.abs(row - cb.r) + Math.abs(col - cb.c);
        return '--d:' + dist * cb.step + 'ms;--s:' + (dist % 2 ? -1 : 1);
      }

      function labelHtml(n, done, fresh) {
        if (!done) return '<span>' + n + '</span>';
        if (!fresh) return '<span class="bingo">' + n + '</span>';
        /* the label lands once the sweep has crossed the line */
        return '<span class="bingo nb" style="--d:' + (2 * celebrate.step + 80) + 'ms">' + n + '<i class="lbl-pts" aria-hidden="true">+' + n + '</i></span>';
      }

      function rowLabelHtml(bi) {
        var h = '';
        for (var i = 3; i >= 1; i--)h += labelHtml(i, bi.rows.indexOf(i) !== -1, celebrate && celebrate.rows.indexOf(i) !== -1);
        return h;
      }
      function colLabelHtml(bi) {
        var h = '';
        for (var i = 1; i <= 3; i++)h += labelHtml(i, bi.cols.indexOf(i) !== -1, celebrate && celebrate.cols.indexOf(i) !== -1);
        return h;
      }

      /* ── Setup ── */
      function renderSetup(b) {
        var bi = {rows: [], cols: [], cells: {}};
        var h = '<div class="bv">';
        h += '<div class="board-section">';
        h += nameHtml(b);
        h += '<div class="board-grid">' + gridCells(b, 'setup') + '</div>';
        h += '<div class="row-labels">' + rowLabelHtml(bi) + '</div>';
        h += '<div class="col-labels">' + colLabelHtml(bi) + '</div>';
        h += '<div class="board-footer"><div class="bv-acts"><button class="btn-full" id="startBtn">' + t('startGame') + '</button>';
        h += '<p class="hint">' + t('fillCells') + '</p></div></div></div></div>';
        main.innerHTML = h;
        bindRename(b);
        var inputs = main.querySelectorAll('.ci');
        inputs.forEach(function (inp, i) {
          inp.addEventListener('input', function () {
            b.words[inp.dataset.r + '-' + inp.dataset.c] = inp.value;
            inp.parentElement.classList.remove('err');
            save();
          });
          /* Enter moves on (Shift+Enter still breaks the line); the last cell hands off to Start */
          inp.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
            e.preventDefault();
            (inputs[i + 1] || document.getElementById('startBtn')).focus();
          });
        });
        if (focusSetup && finePointer) {
          var firstEmpty = Array.prototype.find.call(inputs, function (x) {return !x.value.trim()});
          if (firstEmpty) firstEmpty.focus();
        }
        focusSetup = false;

        main.querySelectorAll('.cell.st').forEach(function (cell) {
          cell.addEventListener('click', function () {
            var textarea = cell.querySelector('.ci');
            if (textarea && document.activeElement !== textarea) {
              textarea.focus();
            }
          });
        });

        document.getElementById('startBtn').addEventListener('click', function () {
          var hasEmpty = false;
          for (var r = 1; r <= 3 && !hasEmpty; r++) {
            for (var c = 1; c <= 3 && !hasEmpty; c++) {
              if (!gw(b, r, c).trim()) hasEmpty = true;
            }
          }
          
          if (hasEmpty) {
            toast(t('allCells'));
            main.querySelectorAll('.ci').forEach(function (inp) {
              var cell = inp.parentElement; 
              if (!inp.value.trim()) cell.classList.add('err'); 
              else cell.classList.remove('err');
            });
            return;
          }

          // ── Duplicate Check (Fully Trimmed Inputs) ──
          var wordsList = [];
          for (var r = 1; r <= 3; r++) {
            for (var c = 1; c <= 3; c++) {
              wordsList.push({ r: r, c: c, val: gw(b, r, c).trim() });
            }
          }

          var seenValues = Object.create(null); /* plain {} would flag words like "constructor" */
          var duplicateCells = new Set();
          wordsList.forEach(function (item) {
            var norm = item.val.toLowerCase().replace(/\s+/g, ' ');
            if (seenValues[norm]) {
              duplicateCells.add(item.r + '-' + item.c);
              duplicateCells.add(seenValues[norm]);
            } else {
              seenValues[norm] = item.r + '-' + item.c;
            }
          });

          if (duplicateCells.size > 0) {
            toast(t('duplicateWords'));
            main.querySelectorAll('.ci').forEach(function (inp) {
              var cellKey = inp.dataset.r + '-' + inp.dataset.c;
              if (duplicateCells.has(cellKey)) {
                inp.parentElement.classList.add('err');
              } else {
                inp.parentElement.classList.remove('err');
              }
            });
            return;
          }
          // ─────────────────────────────────────────────

          for (var r = 1; r <= 3; r++) {
            for (var c = 1; c <= 3; c++) {
              b.words[r + '-' + c] = gw(b, r, c).trim();
            }
          }
          b.phase = 'play'; 
          b.marks = {}; 
          save(); 
          render();
        });

      }

      /* ── Play ── */
      function renderPlay(b) {
        clearTimeout(lpTmr);
        var ae = document.activeElement, refocus = ae && main.contains(ae) && ae.classList.contains('pl') ? ae.dataset.r + '-' + ae.dataset.c : null;
        var bi = bingoInfo(b);
        var h = '<div class="bv">';
        h += '<div class="board-section">';
        h += nameHtml(b);
        h += '<div class="board-grid' + (celebrate ? ' fx-' + celebrate.fx : '') + '">' + gridCells(b, 'play') + '</div>';
        h += '<div class="row-labels">' + rowLabelHtml(bi) + '</div>';
        h += '<div class="col-labels">' + colLabelHtml(bi) + '</div>';
        h += '<div class="board-footer">';
        h += '<div class="leg">';
        h += '<div class="leg-i"><div class="leg-s ls1">\u25CF</div><span class="leg-arrow">\u2192</span><div class="leg-s ls2">\u2605</div>' + t('tapCycle') + '</div>';
        h += '<div class="leg-i"><div class="leg-s ls3">\u2715</div>' + t(finePointer ? 'longPressXMouse' : 'longPressX') + '</div>';
        h += '</div>';
        h += '<div class="sec-btns"><button class="btn-sec" id="resetBtn">' + t('reset') + '</button><button class="btn-sec" id="editBtn">' + t('editBoard') + '</button></div>';
        h += '</div></div></div>';
        main.innerHTML = h;
        popKey = null; celebrate = null; /* one-shot: later re-renders don't replay it */
        bindRename(b);
        var cells = main.querySelectorAll('.cell.pl');
        /* Bind cells via pointer events */
        cells.forEach(function (cell, idx) {
          var r = +cell.dataset.r, c = +cell.dataset.c;
          var lpActive = false, dragged = false;

          function cleanup() {
            cell.classList.remove('pressed'); /* Remove pressed visual immediately */
            clearTimeout(lpTmr); lpTmr = null; lpActive = false;
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            document.removeEventListener('pointercancel', cleanup);
          }

          function onMove(e) {
            if (!lpActive) return;
            var rect = cell.getBoundingClientRect();
            if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
              clearTimeout(lpTmr); dragged = true; cleanup();
            }
          }

          function onUp(e) {
            cleanup();
            if (dragged || lpFired) return;
            var rect = cell.getBoundingClientRect();
            if (!rect.width || e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;

            mark(b, r, c, nextMark(gm(b, r, c)));
          }

          cell.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            lastPointer = e.pointerType;
            if (e.button !== 0) return; /* right-click is handled by contextmenu */
            cell.classList.add('pressed'); /* Trigger visual press down */
            dragged = false; lpFired = false; lpActive = true;
            var rect = cell.getBoundingClientRect();

            lpTmr = setTimeout(function () {
              lpFired = true; lpActive = false;
              cleanup(); /* Immediately lifts the cell visual back up */
              if (navigator.vibrate) navigator.vibrate(25);
              mark(b, r, c, 3); /* Set to X */
            }, LP);

            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
            document.addEventListener('pointercancel', cleanup);
          });

          cell.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            if (lastPointer === 'mouse') mark(b, r, c, 3); /* desktop right-click = X; touch long-press has its own timer */
          });

          cell.addEventListener('keydown', function (e) {
            var m = gm(b, r, c), k = e.key, to = null;
            if (k === 'Enter' || k === ' ') mark(b, r, c, nextMark(m));
            else if (k === 'x' || k === 'X') mark(b, r, c, m === 3 ? 0 : 3);
            else if (k === 'Backspace' || k === 'Delete') {if (m) mark(b, r, c, 0)}
            else if (k === 'ArrowLeft' && idx % 3) to = idx - 1;
            else if (k === 'ArrowRight' && idx % 3 < 2) to = idx + 1;
            else if (k === 'ArrowUp' && idx > 2) to = idx - 3;
            else if (k === 'ArrowDown' && idx < 6) to = idx + 3;
            else return;
            e.preventDefault();
            if (to !== null) cells[to].focus();
          });
          cell.addEventListener('selectstart', function (e) {e.preventDefault()});
        });
        if (refocus) {var rf = main.querySelector('.cell.pl[data-r="' + refocus[0] + '"][data-c="' + refocus[2] + '"]'); if (rf) rf.focus()}
        /* Bind buttons */
        document.getElementById('resetBtn').onclick = function () {
          openModal({
            title: t('resetBoard'),
            desc: t('resetDesc'),
            buttonText: t('reset'),
            onConfirm: function () {
              b.marks = {};
              save();
              render();
            }
          });
        };
        document.getElementById('editBtn').onclick = function () {
          openModal({
            title: t('editBoardTitle'),
            desc: t('editDesc'),
            buttonText: t('editBoard'),
            onConfirm: function () {
              b.phase = 'setup';
              b.marks = {};
              save();
              render();
            }
          });
        };
      }

      /* Tap cycle: Default → Circle → Star → Default (X also clears) */
      function nextMark(m) {return m === 0 ? 1 : m === 1 ? 2 : 0}

      function mark(b, r, c, v) {
        var before = bingoInfo(b);
        sm(b, r, c, v);
        var after = bingoInfo(b),
          rows = after.rows.filter(function (n) {return before.rows.indexOf(n) === -1}),
          cols = after.cols.filter(function (n) {return before.cols.indexOf(n) === -1});
        if (rows.length || cols.length) {
          var fx = Math.floor(Math.random() * (FX.length - 1)); if (fx >= lastFx) fx++; /* any flavor but the last one */
          if (lastFx < 0) fx = Math.floor(Math.random() * FX.length);
          lastFx = fx;
          celebrate = {rows: rows, cols: cols, r: r, c: c, fx: FX[fx], step: 55 + Math.round(Math.random() * 45)};
          announce(rows.map(function (n) {return t('bingoSay', {line: t('rowBingo', {n: n}), n: n})})
            .concat(cols.map(function (n) {return t('bingoSay', {line: t('colBingo', {n: n}), n: n})})).join(', '));
          if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
        }
        popKey = r + '-' + c;
        afterMark(b);
      }

      function afterMark(b) {
        clearTimeout(lpTmr);
        updateHdr();
        renderSb();   /* Re-renders sidebar to update board scores */
        renderPlay(b);
      }

      /* Keep multiple tabs in step */
      window.addEventListener('storage', function (e) {
        if (e.key === KEY) {closeModal(); state = load(); render()}
        else if (e.key === 'jinxo_lang' && e.newValue) {LANG = e.newValue; render(); applyLanguage()}
      });

      render(); applyLanguage();
    })();
  </script>
</body>

</html>
